name: MediGuard                     # ← changed from patientm
description: "Patient monitoring wearable dashboard"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_database: 12.1.3
  cloud_firestore: ^6.1.2
  audioplayers: ^6.6.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1      # ← only the package, no config here

# ═══════════════════════════════════════════
# Launcher icon configuration (top-level)
# ═══════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A1D2E"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/emergency.mp3
    - assets/fall_emergency.mp3
    - assets/medicine_missed.mp3
    - assets/starting.mp3
    - assets/icon/icon.png                # ← add the icon itself